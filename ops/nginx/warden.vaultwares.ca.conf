# warden.vaultwares.ca — the mobile vault and the API it talks to, same origin.
#
# Same origin is the point: the PWA fetches /v1/... with no CORS to arrange, and
# there is no second hostname to add to tailnet DNS. nginx serves the static
# bundle at /, vault-warden keeps everything it owns.
#
# Installed at /etc/nginx/sites-enabled/warden.vaultwares.ca.conf.
#
# nginx.conf includes `sites-enabled/*`, not `*.conf`, so a backup left beside
# the original is loaded as a second server block for the same name — nginx
# warns and ignores it, which is easy to miss. Keep backups in
# /etc/nginx/backups/.

server {
  listen 80;
  listen [::]:80;
  server_name warden.vaultwares.ca;

  # ACME HTTP-01 challenge (public). Keep this location open so certbot can renew.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name warden.vaultwares.ca;

  # Tailnet-only. A vault has no business on the public internet, and
  # vault-warden's whole authentication model is `tailscale whois` on the source
  # address — a request that reaches here from anywhere else has no identity to
  # resolve anyway.
  allow 127.0.0.1;
  allow 100.64.0.0/10;
  deny all;

  root /var/www/warden.vaultwares.ca;
  index index.html;

  # No CORS headers here on purpose. The old config included snippets/cors.conf,
  # which sent Access-Control-Allow-Origin "*" — that let any page the browser
  # happened to load ask this origin for vaults, and the browser would attach
  # the request to the tailnet identity that authenticates it. The PWA is
  # same-origin and needs none of it. The browser extension calls from an
  # extension origin, which is exempt from CORS when the host is in its
  # permissions.

  # ---------------------------------------------------------------- the API
  # Longest-prefix wins over `location /`, so these keep working unchanged.

  location /v1/ {
    proxy_pass http://127.0.0.1:9444;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 1m;
  }

  location = /health {
    proxy_pass http://127.0.0.1:9444;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /docs {
    proxy_pass http://127.0.0.1:9444;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /openapi.json {
    proxy_pass http://127.0.0.1:9444;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # --------------------------------------------------------------- the PWA

  # Never cached: it is the only file that names the current bundle, and a stale
  # copy pins the app to a build that may no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Likewise — a cached service worker outlives the deploy that replaced it.
  location = /service-worker.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # A vault is not for indexing, and the tailnet ACL above already means no
  # crawler can reach it; this is for the case where that is ever loosened.
  location = /robots.txt {
    add_header Content-Type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # Yes, the docs.vaultwares.ca path is correct for warden.vaultwares.ca. It is
  # one multi-SAN certificate covering every vaultwares.ca host — the CN is
  # docs, and warden.vaultwares.ca is among its SANs:
  #
  #   openssl x509 -in /etc/letsencrypt/live/docs.vaultwares.ca/fullchain.pem \
  #     -noout -ext subjectAltName
  #
  # There is no /etc/letsencrypt/live/warden.vaultwares.ca/. "Correcting" this
  # to a per-host path points nginx at files that do not exist and takes the
  # vault down. Certbot renews the whole SAN set together.
  ssl_certificate /etc/letsencrypt/live/docs.vaultwares.ca/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/docs.vaultwares.ca/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
