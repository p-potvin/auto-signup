<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- viewport-fit=cover so the safe-area insets in mobile.css have something
         to work with; without it the notch and home indicator overlap content. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d12">
    <meta name="color-scheme" content="dark">
    <title>VaultWares</title>

    <!-- iOS ignores the web app manifest's display mode; these are what actually
         make the Home Screen icon open without Safari's chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VaultWares">
    <!-- Must be opaque and must carry an explicit size. iOS does not composite
         alpha here the way a browser does — a PNG with transparent corners is
         rendered as a washed grey tile instead of the artwork. -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

    <!-- A vault has nothing to say to a search engine, and the page is
         tailnet-only anyway. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
</head>
<body>
    <div id="root"></div>
</body>
</html>
